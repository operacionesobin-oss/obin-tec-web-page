<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · OBIN</title>
    <!--
      Página servida por Apache vía ErrorDocument, fuera del árbol de React:
      no puede usar los tokens ni las fuentes de Next, así que los valores de
      marca van en línea. Se mantiene deliberadamente mínima.
    -->
    <style>
      :root {
        color-scheme: light;
        --surface: #ffffff;
        --content: #0f1220;
        --content-secondary: #434a68;
        --accent: #253981;
        --accent-btn: #253981;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --surface: #0c0f1b;
          --content: #edeff7;
          --content-secondary: #aeb6ce;
          --accent: #9fb0e0;
          --accent-btn: #4156a8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6vh 5vw;
        background: var(--surface);
        color: var(--content-secondary);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--accent);
        margin: 0;
      }
      h1 {
        margin: 12px 0 0;
        font-size: clamp(40px, 8vw, 72px);
        font-weight: 300;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: var(--content);
        text-wrap: balance;
      }
      p {
        margin: 16px 0 0;
        max-width: 46ch;
        font-size: clamp(17px, 1.1vw + 14px, 20px);
        letter-spacing: -0.012em;
      }
      .en {
        margin-top: 8px;
        font-size: 15px;
        opacity: 0.75;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 36px;
        padding: 14px 22px;
        border-radius: 14px;
        background: var(--accent-btn);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        width: fit-content;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o cambió de sitio.</p>
    <p class="en" lang="en">This page doesn’t exist or has moved.</p>
    <a href="/es/">Volver al inicio · Back to home</a>
  </body>
</html>
